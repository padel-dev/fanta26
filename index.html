<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title"></title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --font-display: 'Oswald', sans-serif;
    --font-body:    'Inter', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14.5px; line-height: 1.55; }

  /* ── STICKY BAR ── */
  .topbar { position: sticky; top: 0; z-index: 300; background: rgba(11,14,19,0.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 4px; padding: 0 14px; height: 52px; }
  .topbar-brand { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 1px; color: #fff; white-space: nowrap; margin-right: auto; }
  .topbar-brand .dot { color: var(--accent); }
  .topbar-links { display: flex; gap: 2px; }
  .topbar-links a { text-decoration: none; font-size: 12px; font-weight: 500; letter-spacing: 0.5px; color: var(--muted); padding: 8px 12px; border-radius: 6px; white-space: nowrap; transition: color 0.15s, background 0.15s; }
  .topbar-links a.active, .topbar-links a:hover { color: var(--accent-light); background: var(--accent-dim); }
  .topbar-live { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); letter-spacing: 0.5px; padding-left: 10px; margin-left: 6px; border-left: 1px solid var(--border); white-space: nowrap; }
  @media (max-width: 560px) { .topbar-live span.txt { display: none; } }

  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,176,32,0.45); } 50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(255,176,32,0); } }

  /* ── HERO (compatto) ── */
  .hero { padding: 1.8rem 1.2rem 1.4rem; max-width: 900px; margin: 0 auto; }
  .hero-eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .hero h1 { font-family: var(--font-display); font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 700; letter-spacing: 0.5px; color: #fff; line-height: 1.05; margin-bottom: 4px; }
  .hero h1 .accent { color: var(--accent); }
  .hero-tagline { font-size: 13px; color: var(--muted); max-width: 480px; margin-bottom: 1.1rem; }
  .hero-stats { display: flex; gap: 1.6rem; flex-wrap: wrap; }
  .hstat { display: flex; align-items: baseline; gap: 6px; }
  .hstat-n { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--accent-light); font-variant-numeric: tabular-nums; }
  .hstat-l { font-size: 10.5px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); }

  .section { padding: 1.6rem 1.2rem 2.6rem; max-width: 1080px; margin: 0 auto; scroll-margin-top: 60px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 1.1rem; flex-wrap: wrap; }
  .sec-title { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; letter-spacing: 0.5px; color: #fff; }
  .sec-sub { font-size: 12px; color: var(--muted); }

  /* ── SQUADRE ── */
  .squadre-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 0.7rem; }
  .squadra-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .squadra-head { padding: 12px 14px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .squadra-head h3 { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; letter-spacing: 0.5px; }
  .squadra-crediti { text-align: right; flex-shrink: 0; }
  .cr-num { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .cr-lbl { font-size: 8.5px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); }
  .budget-bar { height: 3px; background: var(--bg2); margin: 0 14px; border-radius: 2px; overflow: hidden; }
  .budget-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .squadra-body { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 7px; }
  .role-line { display: flex; align-items: flex-start; gap: 8px; }
  .role-tag { font-size: 9.5px; font-weight: 600; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 4px; flex-shrink: 0; margin-top: 1px; text-align: center; white-space: nowrap; }
  .role-players { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
  .player-chip { font-size: 11.5px; background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; display: inline-flex; gap: 5px; align-items: center; }
  .player-chip .px { color: var(--gold); font-weight: 600; font-size: 10.5px; }
  .role-empty { font-size: 11px; color: var(--muted); opacity: 0.55; padding-top: 3px; }

  /* ── FILTERS (giocatori) ── */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; align-items: center; }
  .fpill { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 99px; font-size: 11px; font-weight: 500; letter-spacing: 0.5px; border: 1px solid var(--border); color: var(--muted); background: transparent; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .fpill:hover { border-color: var(--muted); color: var(--text); }
  .fpill.active { border-color: var(--accent); color: var(--accent-light); background: var(--accent-dim); }
  .fsearch { background: var(--card); border: 1px solid var(--border); color: var(--text); font-size: 12px; padding: 7px 12px; border-radius: 99px; outline: none; width: 190px; flex-shrink: 0; }
  .fsearch::placeholder { color: var(--muted); }
  .fsearch:focus { border-color: var(--accent); }
  .ftoggle { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); cursor: pointer; user-select: none; margin-left: auto; }
  .ftoggle input { accent-color: var(--accent); width: 14px; height: 14px; }
  @media (max-width: 560px) { .fsearch { width: 100%; order: 5; } .ftoggle { margin-left: 0; width: 100%; order: 6; } }

  /* ── PLAYER ROWS ── */
  .players-list { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .prow { display: grid; grid-template-columns: 118px 1.3fr 1fr 46px 1.5fr; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); }
  .prow:last-child { border-bottom: none; }
  .prow.assegnato { opacity: 0.5; }
  .prow-head { display: none; }
  .lbl { display: none; }
  .role-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 600; letter-spacing: 0.5px; border-radius: 4px; padding: 3px 7px; justify-content: center; }
  .p-nome { font-weight: 500; color: #fff; font-size: 13px; }
  .p-squadra { color: var(--muted); font-size: 12px; }
  .p-quot { font-family: var(--font-display); font-weight: 600; font-size: 1rem; text-align: center; font-variant-numeric: tabular-nums; }
  .stato-libero { font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--accent-light); font-weight: 500; }
  .stato-assegnato { font-size: 11.5px; color: var(--muted); }
  .stato-assegnato b { color: var(--text); font-weight: 500; }
  .stato-assegnato .prezzo { color: var(--gold); font-weight: 600; }

  @media (max-width: 680px) {
    .prow { grid-template-columns: 1fr; gap: 3px; padding: 11px 14px; }
    .prow > div { display: flex; align-items: center; gap: 6px; }
    .lbl { display: inline-block; font-size: 9.5px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); width: 56px; flex-shrink: 0; }
    .p-quot { text-align: left; }
  }

  .empty-msg { text-align: center; padding: 2.4rem; color: var(--muted); font-size: 13px; }
  .loading-msg { text-align: center; padding: 2.4rem; color: var(--muted); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  .loading-dot { display: inline-block; animation: blink 1.2s infinite; }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

  footer { border-top: 1px solid var(--border); text-align: center; padding: 1.8rem 1.2rem; color: var(--muted); font-size: 11px; letter-spacing: 0.5px; }
  footer .foot-logo { font-family: var(--font-display); font-weight: 600; font-size: 1rem; letter-spacing: 2px; color: #2a2f38; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">FANTA<span class="dot">26</span></div>
  <div class="topbar-links">
    <a href="#squadre" class="active" onclick="setActive(this)">Squadre</a>
    <a href="#giocatori" onclick="setActive(this)">Giocatori</a>
  </div>
  <div class="topbar-live" id="topbar-live"><span class="live-dot"></span><span class="txt">Aggiornato --:--</span></div>
</div>

<div class="hero">
  <div class="hero-eyebrow" id="hero-eyebrow"></div>
  <h1 id="hero-title"></h1>
  <p class="hero-tagline" id="hero-tagline"></p>
  <div class="hero-stats">
    <div class="hstat"><span class="hstat-n" id="stat-partecipanti">--</span><span class="hstat-l">Squadre</span></div>
    <div class="hstat"><span class="hstat-n" id="stat-assegnati">--</span><span class="hstat-l">Assegnati</span></div>
    <div class="hstat"><span class="hstat-n" id="stat-totali">--</span><span class="hstat-l">Totali</span></div>
  </div>
</div>

<div class="section" id="squadre">
  <div class="sec-head">
    <div class="sec-title">Squadre</div>
    <div class="sec-sub" id="sq-sub">Caricamento...</div>
  </div>
  <div id="squadre-container">
    <div class="loading-msg">Caricamento<span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span></div>
  </div>
</div>

<div class="section" id="giocatori">
  <div class="sec-head">
    <div class="sec-title">Giocatori</div>
    <div class="sec-sub" id="gioc-sub">Caricamento...</div>
  </div>
  <div class="filters" id="gioc-filters" style="display:none">
    <div id="role-filter-group" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <input class="fsearch" id="f-search" type="text" placeholder="Cerca..." oninput="applyPlayerFilters()">
    <label class="ftoggle"><input type="checkbox" id="f-solo-liberi" onchange="applyPlayerFilters()"> Solo liberi</label>
  </div>
  <div id="players-container">
    <div class="loading-msg">Caricamento<span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span></div>
  </div>
</div>

<footer>
  <div class="foot-logo" id="footer-logo"></div>
  <div id="footer-sub"></div>
</footer>

<script src="asta-config.js"></script>
<script>
function setText(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }

let ruoliFiltro = 'tutti';
let playersByRole = {};
let partecipanti = [];

function initFromConfig() {
  const root = document.documentElement;
  Object.entries(ASTA_CONFIG.palette).forEach(([k, v]) => root.style.setProperty(k, v));
  document.getElementById('page-title').textContent = ASTA_CONFIG.pageTitle;
  document.getElementById('hero-eyebrow').textContent = ASTA_CONFIG.eyebrow;
  const parts = ASTA_CONFIG.title.split(ASTA_CONFIG.titleAccent);
  document.getElementById('hero-title').innerHTML = parts[0] + '<span class="accent">' + ASTA_CONFIG.titleAccent + '</span>' + (parts[1] || '');
  document.getElementById('hero-tagline').textContent = ASTA_CONFIG.tagline;
  document.getElementById('footer-logo').textContent = ASTA_CONFIG.title;
  document.getElementById('footer-sub').textContent = ASTA_CONFIG.footerSub;

  const fg = document.getElementById('role-filter-group');
  fg.innerHTML = '<button class="fpill active" id="f-tutti" onclick="setRuoloFiltro(\'tutti\')">Tutti</button>';
  ASTA_CONFIG.ruoli.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'fpill';
    btn.id = 'f-' + r.sheet;
    btn.onclick = () => setRuoloFiltro(r.sheet);
    btn.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:' + r.color + ';display:inline-block;flex-shrink:0"></span> ' + r.label;
    btn.dataset.color = r.color;
    fg.appendChild(btn);
  });
  document.getElementById('gioc-filters').style.display = '';
}

// ── FETCH ─────────────────────────────────────────────────────────────────
async function fetchRange(rangeA1) {
  const fields = 'sheets.data.rowData.values(userEnteredValue,formattedValue)';
  const url = 'https://sheets.googleapis.com/v4/spreadsheets/' + ASTA_CONFIG.spreadsheetId
    + '?ranges=' + encodeURIComponent(rangeA1)
    + '&fields=' + encodeURIComponent(fields)
    + '&key=' + ASTA_CONFIG.apiKey;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status + ' \u00b7 ' + rangeA1);
  const json = await res.json();
  return (json.sheets[0].data[0].rowData || []);
}

function cellText(cell) {
  if (!cell) return '';
  const v = cell.userEnteredValue;
  if (v && v.stringValue != null) return v.stringValue.trim();
  if (v && v.numberValue != null) return String(v.numberValue);
  return (cell.formattedValue || '').trim();
}
function cellNumber(cell) {
  const n = parseFloat(cellText(cell).replace(',', '.'));
  return isNaN(n) ? 0 : n;
}

async function loadPartecipanti() {
  const rows = await fetchRange(ASTA_CONFIG.foglioAsta + '!A1:BZ5');
  const rigaNomi  = (rows[1] && rows[1].values) || [];
  const rigaDisp  = (rows[3] && rows[3].values) || [];
  const rigaSpesi = (rows[4] && rows[4].values) || [];
  const result = [];
  for (let c = 0; c < rigaNomi.length; c++) {
    const nome = cellText(rigaNomi[c]);
    if (!nome) continue;
    const disp  = cellNumber(rigaDisp[c + 1]);
    const spesi = cellNumber(rigaSpesi[c + 1]);
    const budgetTotale = (disp + spesi) > 0 ? (disp + spesi) : ASTA_CONFIG.budgetTotaleDefault;
    result.push({ nome, budgetTotale, colore: null });
  }
  result.forEach((p, i) => { p.colore = ASTA_CONFIG.squadreColori[i % ASTA_CONFIG.squadreColori.length]; });
  return result;
}

async function loadRuolo(ruoloCfg) {
  const rows = await fetchRange(ruoloCfg.sheet + '!A2:E1000');
  const list = [];
  rows.forEach(row => {
    const cells = row.values || [];
    const nome = cellText(cells[0]);
    if (!nome) return;
    list.push({
      nome,
      squadra:      cellText(cells[1]),
      quotazione:   cellNumber(cells[2]),
      partecipante: cellText(cells[3]),
      valore:       cellNumber(cells[4]),
    });
  });
  return list;
}

async function loadTutto() {
  try {
    const [parts, ...ruoliData] = await Promise.all([
      loadPartecipanti(),
      ...ASTA_CONFIG.ruoli.map(r => loadRuolo(r)),
    ]);
    partecipanti = parts;
    playersByRole = {};
    ASTA_CONFIG.ruoli.forEach((r, i) => { playersByRole[r.sheet] = ruoliData[i]; });
    buildSquadre();
    buildPlayers();
    updateStats();
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0'), mm = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('topbar-live').innerHTML = '<span class="live-dot"></span><span class="txt">Aggiornato ' + hh + ':' + mm + '</span>';
  } catch (err) {
    const pc = document.getElementById('players-container');
    if (pc) pc.innerHTML = '<div class="loading-msg" style="color:var(--danger);">Errore caricamento dati.<br><span style="font-size:11px;">' + err.message + '</span></div>';
    console.error(err);
  }
}

function updateStats() {
  let totali = 0, assegnati = 0;
  ASTA_CONFIG.ruoli.forEach(r => {
    const list = playersByRole[r.sheet] || [];
    totali += list.length;
    assegnati += list.filter(p => p.partecipante).length;
  });
  setText('stat-totali', totali);
  setText('stat-assegnati', assegnati);
  setText('stat-partecipanti', partecipanti.length);
  setText('gioc-sub', totali + ' giocatori \u00b7 ' + assegnati + ' assegnati');
  setText('sq-sub', partecipanti.length + ' partecipanti');
}

// ── SQUADRE ───────────────────────────────────────────────────────────────
function buildSquadre() {
  const container = document.getElementById('squadre-container');
  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'squadre-grid';
  container.appendChild(grid);

  partecipanti.forEach(part => {
    const c = part.colore;
    let spesoTotale = 0;
    const rosterByRole = {};
    ASTA_CONFIG.ruoli.forEach(r => {
      const presi = (playersByRole[r.sheet] || []).filter(p =>
        p.partecipante && p.partecipante.trim().toUpperCase() === part.nome.trim().toUpperCase()
      );
      rosterByRole[r.sheet] = presi;
      spesoTotale += presi.reduce((s, p) => s + p.valore, 0);
    });
    const rimanenti = part.budgetTotale - spesoTotale;
    const pct = part.budgetTotale > 0 ? Math.min(100, Math.round((spesoTotale / part.budgetTotale) * 100)) : 0;

    let bodyHTML = '';
    ASTA_CONFIG.ruoli.forEach(r => {
      const presi = rosterByRole[r.sheet];
      bodyHTML += '<div class="role-line"><span class="role-tag" style="background:' + r.cssVars['--r-dim'] + ';color:' + r.color + ';">' + r.label + '</span>';
      if (presi.length > 0) {
        bodyHTML += '<div class="role-players">' + presi.map(p =>
          '<span class="player-chip">' + p.nome + ' <span class="px">' + p.valore + '</span></span>'
        ).join('') + '</div>';
      } else {
        bodyHTML += '<span class="role-empty">\u2014</span>';
      }
      bodyHTML += '</div>';
    });

    const card = document.createElement('div');
    card.className = 'squadra-card';
    card.innerHTML =
      '<div class="squadra-head">'
        + '<h3 style="color:' + c.t + ';">' + part.nome + '</h3>'
        + '<div class="squadra-crediti"><div class="cr-num" style="color:' + (rimanenti < 0 ? 'var(--danger)' : c.t) + ';">' + rimanenti + '</div><div class="cr-lbl">crediti</div></div>'
      + '</div>'
      + '<div class="budget-bar"><div class="budget-bar-fill" style="width:' + pct + '%;background:' + c.t + ';"></div></div>'
      + '<div class="squadra-body">' + bodyHTML + '</div>';
    grid.appendChild(card);
  });
}

// ── GIOCATORI ─────────────────────────────────────────────────────────────
function buildPlayers() {
  const container = document.getElementById('players-container');
  container.innerHTML = '<div class="players-list" id="players-list"></div>';
  renderPlayerRows();
}

function renderPlayerRows() {
  const list = document.getElementById('players-list');
  if (!list) return;
  list.innerHTML = '';
  const q = (document.getElementById('f-search').value || '').toLowerCase().trim();
  const soloLiberi = document.getElementById('f-solo-liberi').checked;
  let count = 0;
  ASTA_CONFIG.ruoli.forEach(r => {
    if (ruoliFiltro !== 'tutti' && ruoliFiltro !== r.sheet) return;
    (playersByRole[r.sheet] || []).forEach(p => {
      if (soloLiberi && p.partecipante) return;
      if (q && !p.nome.toLowerCase().includes(q) && !p.squadra.toLowerCase().includes(q)) return;
      count++;
      const row = document.createElement('div');
      row.className = 'prow' + (p.partecipante ? ' assegnato' : '');
      const statoHTML = p.partecipante
        ? '<span class="stato-assegnato">assegnato a <b>' + p.partecipante + '</b> \u00b7 <span class="prezzo">' + p.valore + ' cr</span></span>'
        : '<span class="stato-libero">Libero</span>';
      row.innerHTML =
        '<div><span class="role-chip" style="background:' + r.cssVars['--r-dim'] + ';color:' + r.color + ';">' + r.label + '</span></div>'
        + '<div class="p-nome">' + p.nome + '</div>'
        + '<div><span class="lbl">Squadra</span><span class="p-squadra">' + p.squadra + '</span></div>'
        + '<div><span class="lbl">Quot.</span><span class="p-quot">' + p.quotazione + '</span></div>'
        + '<div><span class="lbl">Stato</span>' + statoHTML + '</div>';
      list.appendChild(row);
    });
  });
  if (count === 0) {
    list.innerHTML = '<div class="empty-msg">Nessun giocatore trovato.</div>';
  }
}

function setRuoloFiltro(ruolo) {
  ruoliFiltro = ruolo;
  document.querySelectorAll('.fpill').forEach(b => { b.classList.remove('active'); b.style.borderColor=''; b.style.color=''; b.style.background=''; });
  if (ruolo === 'tutti') {
    document.getElementById('f-tutti').classList.add('active');
  } else {
    const btn = document.getElementById('f-' + ruolo);
    if (btn) { btn.classList.add('active'); btn.style.borderColor = btn.dataset.color; btn.style.color = btn.dataset.color; }
  }
  renderPlayerRows();
}
function applyPlayerFilters() { renderPlayerRows(); }

function setActive(el) {
  document.querySelectorAll('.topbar-links a').forEach(a => a.classList.remove('active'));
  el.classList.add('active');
}

initFromConfig();
loadTutto();
setInterval(loadTutto, (ASTA_CONFIG.refreshSeconds || 20) * 1000);
</script>
</body>
</html>
